# Configuration de la page de statut publique https://status.lokyzen.com (Upptime).
# Copie de référence : le fichier actif est à la racine du dépôt public Inferevo/lokyzen-status.
# Mise en place et mises à jour : docs/production/page-de-statut.md.
owner: Inferevo
repo: lokyzen-status

# Sondes : une requête toutes les 5 minutes depuis GitHub Actions (hors de nos serveurs Scaleway).
sites:
  - name: Application
    url: https://lokyzen.com/api/health
    # 503 « db_unavailable » quand la base ne répond pas : compté comme panne.
    expectedStatusCodes:
      - 200
    icon: https://lokyzen.com/brand/lokyzen-favicon.svg
  - name: Site lokyzen.com
    url: https://lokyzen.com
    icon: https://lokyzen.com/brand/lokyzen-favicon.svg

# Incidents ouverts à la main (onglet Issues du dépôt) : seuls ces comptes peuvent les créer ou les fermer.
assignees:
  - bebouze

workflowSchedule:
  uptime: '*/5 * * * *'
  responseTime: '0 23 * * *'
  graphs: '0 0 * * *'
  summary: '0 0 * * *'
  staticSite: '0 1 * * *'
  updateTemplate: '0 0 * * *'
  updates: '0 3 * * *'

status-website:
  cname: status.lokyzen.com
  name: Lokyzen · État du service
  introTitle: État du service Lokyzen
  introMessage: Disponibilité de l'application et du site Lokyzen, vérifiée toutes les 5 minutes. Cette page est hébergée hors de nos serveurs et reste lisible pendant une panne.
  logoUrl: https://lokyzen.com/brand/lokyzen-horizontal-fr.svg
  favicon: https://lokyzen.com/brand/lokyzen-favicon.svg
  theme: light
  navbar:
    - title: État
      href: /
    - title: Lokyzen
      href: https://lokyzen.com
    - title: Nous contacter
      href: https://lokyzen.com/aide#aide-contact

